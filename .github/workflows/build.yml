name: Build, test and stage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cmake
        uses: lukka/get-cmake@latest

      - name: Install cross-compilation tools (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies
        run: npm ci

      - name: Build native module (cross linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: npx napi build --platform --release --target ${{ matrix.target }}
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build native module
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Test
        if: "!contains(matrix.target, 'aarch64-unknown-linux') && !contains(matrix.target, 'aarch64-pc-windows') && !(matrix.os == 'macos-15' && matrix.target == 'x86_64-apple-darwin')"
        run: npm test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  stage:
    needs: build
    uses: photon-hq/buildspace/.github/workflows/package-stage.yml@f2b0f40bb808a721d71711a4db59d234d86736a6
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    with:
      registry: https://registry.npmjs.org
      package: heif2jpeg
      package-selection: >-
        heif2jpeg
        @heif2jpeg/heif2jpeg-darwin-arm64 @heif2jpeg/heif2jpeg-darwin-x64
        @heif2jpeg/heif2jpeg-linux-arm64-gnu @heif2jpeg/heif2jpeg-linux-x64-gnu
        @heif2jpeg/heif2jpeg-win32-arm64-msvc @heif2jpeg/heif2jpeg-win32-x64-msvc
      setup-pnpm: false
      install: npm ci
      verify: |
        gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'bindings-*' --dir artifacts
        npx --no-install napi artifacts --dir artifacts
      pack: python3 scripts/pack-release.py
      dry-run: ${{ github.event_name == 'pull_request' }}
